<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blip</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- One surface that physically morphs between pill and panel. Each view
     is a layer pinned to the surface's top-right; the surface clips them. -->
<div id="surface" data-view="pill">

  <div class="layer" id="pillLayer" data-tauri-drag-region>
    <span class="sdot" id="sdot"></span>
    <span id="pilltext" data-tauri-drag-region>Resting</span>
    <button class="gear" id="gear" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>
  </div>

  <div class="layer card" id="panelLayer">
    <header>
      <span class="label">top matches</span>
      <div class="hbtns">
        <button class="btn" id="openall" title="Open all in browser">open all</button>
        <button class="btn" id="minbtn" title="Back to pill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 14 10 14 10 20"></polyline><polyline points="20 10 14 10 14 4"></polyline><line x1="14" y1="10" x2="21" y2="3"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
          minimize
        </button>
      </div>
    </header>
    <div id="jobs"></div>
    <footer id="stats"></footer>
  </div>

  <div class="layer card" id="setLayer">
    <header>
      <span class="label">blip</span>
      <button class="btn" id="setclose">close</button>
    </header>
    <div class="row"><span class="rlabel">scan now</span><button class="btn accent" id="scannow"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4.6v14.8a1 1 0 0 0 1.52.85l12-7.4a1 1 0 0 0 0-1.7l-12-7.4A1 1 0 0 0 6 4.6z"></path></svg>scan</button></div>
    <div class="row"><span class="rlabel">pause / resume</span><button class="btn" id="pausebtn"></button></div>
    <div class="row"><span class="rlabel">cycle</span><span class="rval" id="cycletxt">every 30 min</span></div>
    <div class="row"><span class="rlabel">full settings</span><span class="rval">phase 3 · config.json for now</span></div>
    <div class="row" id="errrow" hidden><span class="rlabel">last error</span><span class="rval err" id="errtxt"></span></div>
    <div class="row"><span class="rlabel">quit blip</span><button class="btn danger" id="quitbtn">quit</button></div>
  </div>

</div>

<script src="main.js"></script>
</body>
</html>
